<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .rating {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .rating label {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 6px;
            cursor: pointer;
            font-weight: normal;
        }

        .rating input {
            width: auto;
            margin-right: 5px;
        }

        .rating label:hover {
            background: #e0e5ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .rating {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Feedback Form</h1>
        <p class="subtitle">
            We value your feedback. Please share your experience with us.
        </p>

        <form onsubmit="submitFeedback(event)">

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll"
                       placeholder="Enter your roll number" required>
            </div>

            <div class="form-group">
                <label for="course">Course / Class</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>B.Tech</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject"
                       placeholder="Enter subject name" required>
            </div>

            <div class="form-group">
                <label>How would you rate the teaching?</label>

                <div class="rating">
                    <label>
                        <input type="radio" name="rating" value="Excellent" required>
                        Excellent
                    </label>

                    <label>
                        <input type="radio" name="rating" value="Good">
                        Good
                    </label>

                    <label>
                        <input type="radio" name="rating" value="Average">
                        Average
                    </label>

                    <label>
                        <input type="radio" name="rating" value="Poor">
                        Poor
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="content">
                    How satisfied are you with the course content?
                </label>

                <select id="content" name="content" required>
                    <option value="">-- Select Rating --</option>
                    <option>Very Satisfied</option>
                    <option>Satisfied</option>
                    <option>Neutral</option>
                    <option>Dissatisfied</option>
                    <option>Very Dissatisfied</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Additional Comments</label>

                <textarea id="comments" name="comments"
                    placeholder="Write your feedback here..."></textarea>
            </div>

            <div class="form-group">
                <label for="suggestions">Suggestions for Improvement</label>

                <textarea id="suggestions" name="suggestions"
                    placeholder="Enter your suggestions..."></textarea>
            </div>

            <button type="submit">Submit Feedback</button>

        </form>

        <div class="footer">
            Thank you for helping us improve!
        </div>

    </div>

    <script>
        function submitFeedback(event) {
            event.preventDefault();

            alert("Thank you! Your feedback has been submitted successfully.");

            event.target.reset();
        }
    </script>

</body>
</html>
